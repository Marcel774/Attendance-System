<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Attendance</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1d2b3a;
      --muted: #748195;
      --line: #e8edf3;
      --bg: #f5f7fb;
      --purple: #6658d3;
      --green: #16875b;
      --red: #d34b5b;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    button, input { font: inherit; }
    .app { width: min(1120px, calc(100% - 36px)); margin: 0 auto; padding: 38px 0 56px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 30px; }
    .brand { display: flex; align-items: center; gap: 14px; }
    .brand-icon { display: grid; width: 48px; height: 48px; place-items: center; border-radius: 15px; background: #eae8ff; color: var(--purple); font-size: 24px; }
    h1 { margin: 0; font-size: 22px; letter-spacing: -0.5px; }
    .subtitle { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
    .date-control { display: flex; align-items: center; gap: 10px; padding: 10px 13px; border: 1px solid var(--line); border-radius: 12px; background: white; color: var(--muted); font-size: 13px; }
    .date-control input { max-width: 145px; border: 0; outline: 0; color: var(--ink); background: transparent; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 22px; }
    .stat-card, .panel { border: 1px solid var(--line); border-radius: 16px; background: white; box-shadow: 0 5px 20px rgba(32, 47, 74, 0.035); }
    .stat-card { display: flex; align-items: center; gap: 14px; padding: 20px; }
    .stat-icon { display: grid; width: 44px; height: 44px; place-items: center; border-radius: 13px; background: #f1f0ff; font-size: 20px; }
    .stat-card:nth-child(2) .stat-icon { background: #eaf8f1; }
    .stat-card:nth-child(3) .stat-icon { background: #fff0f1; }
    .stat-label { color: var(--muted); font-size: 13px; }
    .stat-value { margin-top: 3px; font-size: 24px; font-weight: 700; }
    .panel { padding: 22px; }
    .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 20px; }
    h2 { margin: 0; font-size: 17px; }
    .list-caption { margin: 5px 0 0; color: var(--muted); font-size: 13px; }
    .search-wrap { position: relative; }
    .search-wrap span { position: absolute; top: 50%; left: 12px; transform: translateY(-50%); color: #929daf; }
    .search-wrap input, .add-form input { height: 42px; border: 1px solid var(--line); border-radius: 10px; outline: none; background: #fff; color: var(--ink); }
    .search-wrap input { width: 220px; padding: 0 12px 0 36px; }
    input:focus { border-color: #aaa2ee; box-shadow: 0 0 0 3px #f0efff; }
    .add-form { display: flex; gap: 9px; margin-bottom: 20px; }
    .add-form input { flex: 1; min-width: 0; padding: 0 13px; }
    .button { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 42px; padding: 0 15px; border: 0; border-radius: 10px; cursor: pointer; font-weight: 600; transition: transform 0.15s ease, opacity 0.15s ease; }
    .button:hover { transform: translateY(-1px); }
    .button:active { transform: translateY(0); }
    .button-primary { background: var(--purple); color: white; }
    .button-present { background: #eaf8f1; color: var(--green); }
    .button-absent { background: #fff0f1; color: var(--red); }
    .button-delete { width: 36px; min-height: 36px; padding: 0; background: transparent; color: #9aa4b2; }
    .button-delete:hover { background: #fff0f1; color: var(--red); }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th { padding: 12px 14px; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; }
    td { padding: 13px 14px; border-bottom: 1px solid #f0f2f6; font-size: 14px; }
    tbody tr:last-child td { border-bottom: 0; }
    .student-name { display: flex; align-items: center; gap: 11px; font-weight: 600; }
    .avatar { display: grid; width: 34px; height: 34px; place-items: center; border-radius: 11px; background: #f0efff; color: var(--purple); font-size: 13px; font-weight: 700; text-transform: uppercase; }
    .status { display: inline-flex; align-items: center; gap: 6px; padding: 6px 9px; border-radius: 20px; font-size: 12px; font-weight: 600; }
    .status::before { width: 6px; height: 6px; border-radius: 50%; content: ""; }
    .status-present { background: #eaf8f1; color: var(--green); }
    .status-present::before { background: var(--green); }
    .status-absent { background: #fff0f1; color: var(--red); }
    .status-absent::before { background: var(--red); }
    .status-unmarked { background: #f1f3f6; color: #758195; }
    .status-unmarked::before { background: #9aa4b2; }
    .row-actions { display: flex; align-items: center; justify-content: flex-end; gap: 7px; }
    .row-actions .button { min-height: 34px; padding: 0 10px; font-size: 12px; }
    .empty-state { padding: 42px 12px; color: var(--muted); text-align: center; }
    .empty-state strong { display: block; margin-bottom: 6px; color: var(--ink); }
    .toast { position: fixed; right: 22px; bottom: 22px; max-width: calc(100% - 44px); padding: 12px 16px; border-radius: 11px; background: #243248; color: white; box-shadow: 0 8px 24px #17203333; font-size: 14px; opacity: 0; pointer-events: none; transform: translateY(8px); transition: 0.2s ease; }
    .toast.show { opacity: 1; transform: translateY(0); }
    @media (max-width: 700px) {
      .app { width: min(100% - 24px, 600px); padding-top: 24px; }
      header { align-items: flex-start; flex-direction: column; }
      .date-control { width: 100%; justify-content: space-between; }
      .date-control input { max-width: 170px; }
      .stats { gap: 9px; }
      .stat-card { align-items: flex-start; flex-direction: column; gap: 9px; padding: 13px; }
      .stat-icon { width: 36px; height: 36px; font-size: 17px; }
      .stat-value { font-size: 21px; }
      .toolbar { align-items: stretch; flex-direction: column; }
      .search-wrap input { width: 100%; }
      .row-actions { flex-wrap: wrap; }
      .row-actions .button { min-height: 32px; padding: 0 8px; }
      th, td { padding-right: 9px; padding-left: 9px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div class="brand">
        <div class="brand-icon" aria-hidden="true">✓</div>
        <div><h1>Student Attendance</h1><p class="subtitle">Keep track of who's in class.</p></div>
      </div>
      <label class="date-control"><span aria-hidden="true">📅</span><span>Attendance date</span><input id="attendanceDate" type="date" aria-label="Attendance date" /></label>
    </header>

    <section class="stats" aria-label="Attendance summary">
      <article class="stat-card"><div class="stat-icon" aria-hidden="true">👥</div><div><div class="stat-label">Total students</div><div class="stat-value" id="totalCount">0</div></div></article>
      <article class="stat-card"><div class="stat-icon" aria-hidden="true">✅</div><div><div class="stat-label">Present</div><div class="stat-value" id="presentCount">0</div></div></article>
      <article class="stat-card"><div class="stat-icon" aria-hidden="true">✕</div><div><div class="stat-label">Absent</div><div class="stat-value" id="absentCount">0</div></div></article>
    </section>

    <section class="panel">
      <div class="toolbar">
        <div><h2>Class roster</h2><p class="list-caption" id="listCaption">Manage students and mark attendance.</p></div>
        <div class="search-wrap"><span aria-hidden="true">⌕</span><input id="searchInput" type="search" placeholder="Search students..." aria-label="Search students by name" /></div>
      </div>
      <form class="add-form" id="addForm">
        <input id="studentName" type="text" maxlength="80" placeholder="Enter a student's name" aria-label="Student name" required />
        <button class="button button-primary" type="submit">＋ <span>Add student</span></button>
      </form>
      <div class="table-wrap">
        <table>
          <thead><tr><th scope="col">Student</th><th scope="col">Status</th><th scope="col" style="text-align:right">Mark attendance</th></tr></thead>
          <tbody id="studentRows"></tbody>
        </table>
        <div id="emptyState" class="empty-state" hidden><strong>No students yet</strong>Add a student above to get started.</div>
        <div id="noMatches" class="empty-state" hidden><strong>No matching students</strong>Try another name.</div>
      </div>
    </section>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const STUDENTS_KEY = "studentAttendance.students.v1";
    const RECORDS_KEY = "studentAttendance.records.v1";
    const dateInput = document.getElementById("attendanceDate");
    const rows = document.getElementById("studentRows");
    const searchInput = document.getElementById("searchInput");
    const emptyState = document.getElementById("emptyState");
    const noMatches = document.getElementById("noMatches");
    const toast = document.getElementById("toast");

    function readStorage(key, fallback) {
      try { return JSON.parse(localStorage.getItem(key)) ?? fallback; }
      catch { return fallback; }
    }

    let students = readStorage(STUDENTS_KEY, []);
    let records = readStorage(RECORDS_KEY, {});
    if (!Array.isArray(students)) students = [];
    if (!records || typeof records !== "object" || Array.isArray(records)) records = {};

    function save() {
      localStorage.setItem(STUDENTS_KEY, JSON.stringify(students));
      localStorage.setItem(RECORDS_KEY, JSON.stringify(records));
    }

    function localDateString(date = new Date()) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    dateInput.value = localDateString();

    function currentRecord() {
      const date = dateInput.value;
      if (!records[date]) records[date] = {};
      return records[date];
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(showToast.timeout);
      showToast.timeout = setTimeout(() => toast.classList.remove("show"), 2200);
    }

    function markAttendance(id, status) {
      currentRecord()[id] = status;
      save();
      render();
    }

    function deleteStudent(id) {
      const student = students.find(item => item.id === id);
      if (!student || !window.confirm(`Delete ${student.name} and their attendance records?`)) return;
      students = students.filter(item => item.id !== id);
      Object.values(records).forEach(record => {
        if (record && typeof record === "object") delete record[id];
      });
      save();
      render();
      showToast(`${student.name} was deleted.`);
    }

    function render() {
      const record = currentRecord();
      const query = searchInput.value.trim().toLocaleLowerCase();
      const visibleStudents = students.filter(student => student.name.toLocaleLowerCase().includes(query));
      document.getElementById("totalCount").textContent = students.length;
      document.getElementById("presentCount").textContent = students.filter(student => record[student.id] === "present").length;
      document.getElementById("absentCount").textContent = students.filter(student => record[student.id] === "absent").length;
      const formattedDate = dateInput.value
        ? new Date(`${dateInput.value}T00:00:00`).toLocaleDateString(undefined, { weekday: "long", year: "numeric", month: "long", day: "numeric" })
        : "Select a date";
      document.getElementById("listCaption").textContent = `Attendance for ${formattedDate} · ${students.length} student${students.length === 1 ? "" : "s"}`;
      rows.replaceChildren();
      emptyState.hidden = students.length !== 0;
      noMatches.hidden = students.length === 0 || visibleStudents.length !== 0;

      visibleStudents.forEach(student => {
        const status = record[student.id] || "unmarked";
        const statusText = status === "present" ? "Present" : status === "absent" ? "Absent" : "Not marked";
        const tr = document.createElement("tr");
        const nameCell = document.createElement("td");
        const nameWrap = document.createElement("div");
        nameWrap.className = "student-name";
        const avatar = document.createElement("span");
        avatar.className = "avatar";
        avatar.setAttribute("aria-hidden", "true");
        avatar.textContent = student.name.trim().charAt(0) || "?";
        const name = document.createElement("span");
        name.textContent = student.name;
        nameWrap.append(avatar, name);
        nameCell.append(nameWrap);

        const statusCell = document.createElement("td");
        const badge = document.createElement("span");
        badge.className = `status status-${status}`;
        badge.textContent = statusText;
        statusCell.append(badge);

        const actionCell = document.createElement("td");
        const actionWrap = document.createElement("div");
        actionWrap.className = "row-actions";
        const presentButton = document.createElement("button");
        presentButton.type = "button";
        presentButton.className = "button button-present";
        presentButton.textContent = "✓ Present";
        presentButton.setAttribute("aria-label", `Mark ${student.name} present`);
        presentButton.addEventListener("click", () => markAttendance(student.id, "present"));
        const absentButton = document.createElement("button");
        absentButton.type = "button";
        absentButton.className = "button button-absent";
        absentButton.textContent = "✕ Absent";
        absentButton.setAttribute("aria-label", `Mark ${student.name} absent`);
        absentButton.addEventListener("click", () => markAttendance(student.id, "absent"));
        const deleteButton = document.createElement("button");
        deleteButton.type = "button";
        deleteButton.className = "button button-delete";
        deleteButton.textContent = "🗑";
        deleteButton.setAttribute("aria-label", `Delete ${student.name}`);
        deleteButton.title = "Delete student";
        deleteButton.addEventListener("click", () => deleteStudent(student.id));
        actionWrap.append(presentButton, absentButton, deleteButton);
        actionCell.append(actionWrap);
        actionCell.style.textAlign = "right";
        tr.append(nameCell, statusCell, actionCell);
        rows.append(tr);
      });
    }

    document.getElementById("addForm").addEventListener("submit", event => {
      event.preventDefault();
      const input = document.getElementById("studentName");
      const name = input.value.trim();
      if (!name) return;
      const duplicate = students.some(student => student.name.toLocaleLowerCase() === name.toLocaleLowerCase());
      if (duplicate) { showToast("That student is already on the roster."); return; }
      students.push({
        id: window.crypto?.randomUUID?.() || `${Date.now()}-${Math.random().toString(16).slice(2)}`,
        name
      });
      save();
      input.value = "";
      render();
      input.focus();
      showToast(`${name} was added.`);
    });

    dateInput.addEventListener("change", render);
    searchInput.addEventListener("input", render);
    render();
  </script>
</body>
</html>
